version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # A version published a moment ago is not taken at once: a compromised release is usually withdrawn within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dotnet:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # A version published a moment ago is not taken at once: a compromised release is usually withdrawn within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The release tooling is its own package: only the release job installs it.
  - package-ecosystem: "npm"
    directory: "/tools/release"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      release-tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # This code runs in the job that can write to the repository: same cooldown, and its lockfile diff is reviewed as privileged code.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

  # The collector is not in the image (ADR 0013): its bumps do not release a version of it.
  - package-ecosystem: "cargo"
    directory: "/collector"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # A version published a moment ago is not taken at once: a compromised release is usually withdrawn within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # A version published a moment ago is not taken at once: a compromised release is usually withdrawn within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

  # The assistant runner (ADR 0035) is its own image: its base image is pinned by digest, and the agent CLI it carries by a lockfile.
  # It holds the credentials of the model, so a new version is not taken at once either.
  - package-ecosystem: "docker"
    directory: "/agent"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/agent/cli"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # A version published a moment ago is not taken at once: a compromised release is usually withdrawn within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
