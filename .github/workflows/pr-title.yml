# The title of a pull request into develop becomes the squash commit, and the Conventional Commits decide the next version
# (docs/releasing.md): a title that is not one silently drops a fix from the release. No secret, no checkout, no third-party action.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  conventional-title:
    name: conventional-title
    runs-on: ubuntu-latest
    # The release pull request into main is merged with a merge commit: its title is not a commit.
    if: github.event.pull_request.base.ref != 'main'
    steps:
      - name: The title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(\([a-z0-9._/-]+\))?!?: .+'
          # The pattern is the only logic of this check: it is tested before it judges the title.
          for title in 'feat(api): x' 'fix: x' 'feat!: x' 'chore(deps-dev): Bump y from 1 to 2' 'docs(adr): z'; do
            printf '%s' "$title" | grep -Eq "$pattern" || { echo "::error::The pattern rejects '$title'"; exit 1; }
          done
          for title in 'Fix: x' 'feat(API): x' 'feat:x' 'feat(): x' 'Update stuff' 'feat: '; do
            printf '%s' "$title" | grep -Eq "$pattern" && { echo "::error::The pattern accepts '$title'"; exit 1; }
          done
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error title=Not a Conventional Commit::\"$TITLE\" should look like 'feat(api): add the status endpoint' or 'fix: ...' (types: feat, fix, perf, revert, docs, style, refactor, test, build, ci, chore)."
            exit 1
          fi
