# Pipeline derived from Portarr's, itself derived from the organization's github-template (dotnet stack),
# for Mnemarr's components: the .NET core, the React frontend and the Rust collector (ADR 0008).
# Pull requests are built and tested here, but only develop and main publish an image. On main, semantic-release then decides
# the version from the Conventional Commits since the last release, and the image is published under it (docs/releasing.md).
name: CI

on:
  push:
    branches: [main, develop]
  # Every pull request, including stacked ones whose base is another feature branch.
  pull_request:
  # On demand: the Actions tab, "Run workflow", or `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A run on main may be a release in flight (a tag, then the image): it is never cancelled by the next push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: dotnet format src/Mnemarr.sln --verify-no-changes
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn stylelint
      - run: yarn format:check
      - run: yarn typecheck

  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet build src/Mnemarr.sln --configuration Release
      # Exit code 8 means "no test matched the filter" in a project: expected, each project holds one kind.
      - name: Unit tests
        run: >
          dotnet test --solution src/Mnemarr.sln --configuration Release --no-build --
          --filter-not-trait "Category=Integration" --ignore-exit-code 8
          --coverage --coverage-output-format xml --results-directory "$PWD/coverage/unit"
      - name: Integration tests
        run: >
          dotnet test --solution src/Mnemarr.sln --configuration Release --no-build --
          --filter-trait "Category=Integration" --ignore-exit-code 8
          --coverage --coverage-output-format xml --results-directory "$PWD/coverage/integration"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-backend
          path: coverage/

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-frontend
          path: coverage/frontend/

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium firefox
      - name: Build the image and start the e2e stack
        run: docker compose -f tests/e2e/stack/docker-compose.yml up -d --build
      - name: Wait for Mnemarr
        run: timeout 60 bash -c 'until curl -fs http://localhost:8383/health/live; do sleep 1; done'
      - name: The image runs as a non-root user
        run: |
          container=$(docker compose -f tests/e2e/stack/docker-compose.yml ps -q mnemarr)
          user=$(docker inspect --format '{{.Config.User}}' "$container")
          echo "user: $user"
          test -n "$user" && test "$user" != "0" && test "$user" != "root"
      - run: yarn e2e --grep @smoke
      - if: failure()
        run: docker compose -f tests/e2e/stack/docker-compose.yml logs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/

  # The collector (ADR 0005) is a small Rust program that runs on the operator's machines, Windows and Linux:
  # it has its own checks on both, then a smoke test of the real binary.
  collector:
    name: collector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A test that starts the collector in the background must end: if one hangs, the job is stopped here, not after six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Format, lint and test
        working-directory: collector
        shell: bash
        run: |
          rustup component add clippy rustfmt
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Build the collector
        working-directory: collector
        run: cargo build --release --locked
      - name: Smoke test the binary
        working-directory: collector
        shell: bash
        run: |
          binary=target/release/mnemarr-collector
          [ -x "$binary" ] || binary="$binary.exe"
          "$binary" --version | grep -q '^mnemarr-collector '
      # The program that was just tested is kept, with its checksum: it is what a machine installs (ADR 0027, and the release of vertical 2b).
      - name: Checksum
        working-directory: collector/target/release
        shell: bash
        run: |
          binary=${{ runner.os == 'Windows' && 'mnemarr-collector.exe' || 'mnemarr-collector' }}
          sha256sum "$binary" > "$binary.sha256"
      - name: Keep the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mnemarr-collector-${{ matrix.os }}
          path: |
            collector/target/release/mnemarr-collector
            collector/target/release/mnemarr-collector.exe
            collector/target/release/mnemarr-collector*.sha256
          if-no-files-found: error
          retention-days: 14

  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    # Runs once a SonarQube server is configured (repository variable + secret).
    if: vars.SONAR_HOST_URL != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: coverage/
      # Pinned: this job holds the SonarQube token, so a new release must not run in it unreviewed.
      - run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0
      # Roslyn/IDE analyzers are already enforced by the build and dotnet format: importing them into
      # Sonar only duplicates them.
      # The .NET scanner does not read SONAR_TOKEN for `begin`, so the token is an argument of `begin` and `end`. This job runs the
      # pull request's own code (the build): same-repository branch authors are trusted with this secret, and pull requests from
      # forks never get it.
      # Documented exception (CLAUDE.md): docker:S8431 asks for the tag or the digest of a base image, not both. The Dockerfile keeps
      # both on purpose: the digest makes a build reproducible, the tag is what Dependabot follows to move the digest (ADR 0013).
      - name: Begin SonarQube analysis
        run: >
          dotnet sonarscanner begin
          /k:"${{ github.repository_owner }}_${{ github.event.repository.name }}"
          /d:sonar.host.url="${{ vars.SONAR_HOST_URL }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage/**/*.xml"
          /d:sonar.javascript.lcov.reportPaths="coverage/coverage-frontend/lcov.info"
          /d:sonar.coverage.exclusions="**/obj/**,**/*.g.cs,**/__tests__/**,tests/**"
          /d:sonar.cs.roslyn.ignoreIssues=true
          /d:sonar.qualitygate.wait=true
          /d:sonar.issue.ignore.multicriteria=e1
          /d:sonar.issue.ignore.multicriteria.e1.ruleKey="docker:S8431"
          /d:sonar.issue.ignore.multicriteria.e1.resourceKey="Dockerfile"
      - run: dotnet build src/Mnemarr.sln
      - name: End SonarQube analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # gitleaks-action needs a license key on organization repositories; the CLI does not.
      - name: Secret scanning (gitleaks)
        run: |
          # A downloaded scanner runs in the job that guards the secrets: check it against the published checksums.
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.21.2
          curl -sSfLO "$base/gitleaks_8.21.2_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_8.21.2_checksums.txt"
          grep ' gitleaks_8.21.2_linux_x64.tar.gz$' gitleaks_8.21.2_checksums.txt | sha256sum -c -
          tar xzf gitleaks_8.21.2_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --verbose
      - name: Dependency and config scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"

  # A merge into main with no Sonar server configured is not a silent no-op: `release` and `image` are skipped (a release needs the
  # analysis to have passed), and this says why.
  sonar-not-configured:
    name: sonar-not-configured
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SONAR_HOST_URL == '' }}
    steps:
      - run: echo "::warning title=No release::SONAR_HOST_URL is not set, so the SonarQube analysis was skipped; a release needs it to have passed. Nothing was released or published (docs/releasing.md)."

  # The things that decide a version: the release rules, the version of an image and the guard on the seed tag (tools/release/test).
  release-tooling:
    name: release-tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: yarn install --frozen-lockfile --ignore-scripts
        working-directory: tools/release
      - run: yarn test
        working-directory: tools/release
      # The title agent (tools/title-agent) has no dependency: Node's own runner, with a fake CLI.
      - name: Title agent tests
        run: node --test tools/title-agent/main.test.mjs

  # The version of what was merged into main: semantic-release reads the Conventional Commits since the last tag, creates the tag
  # and the GitHub release (its notes are the changelog), and says the version it chose ('' when nothing deserves a release).
  # Nothing is committed back to main (the ruleset forbids a direct push): the version lives in the tag.
  release:
    name: release
    runs-on: ubuntu-latest
    # The same list as the `image` job below: a gate added to one is added to the other (tools/release/test checks it, and reads
    # `needs` as one inline list and `if` as a folded `>-` block: that format is load-bearing).
    needs: [lint, test-backend, test-frontend, e2e-smoke, collector, sonarqube, security, release-tooling]
    # The tag cannot be undone, so the gate is the strictest one: nothing failed or was cancelled, the end-to-end test ran and passed, and the
    # Sonar analysis ran and passed (a skipped analysis, because the server is not configured, does not release).
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && needs.e2e-smoke.result == 'success' && needs.sonarqube.result == 'success' }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # The only job that can write to the repository, so it installs as little as it can: the release tooling alone (tools/release,
      # its own lockfile), without running any install script, and the checkout keeps no credential in .git/config
      # (semantic-release authenticates its push with the GITHUB_TOKEN of its environment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No package cache either: a cache entry written by an earlier job of the push would be restored here, in the job that can write.
          # Stated, because setup-node may turn the cache on by itself when package.json declares a package manager.
          package-manager-cache: false
      - run: yarn install --frozen-lockfile --ignore-scripts
        working-directory: tools/release
      # Without a tag to count from, the first release would be 1.0.0 and could not be undone (docs/releasing.md, "The seed tag").
      - name: A release tag to count from exists
        run: bash tools/release/scripts/require-release-tag.sh
      - id: release
        working-directory: tools/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn semantic-release

  # Integrated code only, and only code that passed every gate: pull requests never publish an image, and neither does a push
  # whose tests, scans or Sonar analysis failed. On main the release job must have succeeded (with no version when nothing deserves
  # one); on develop it is skipped.
  image:
    name: image
    runs-on: ubuntu-latest
    # The same gates as the `release` job above, and that job.
    needs: [lint, test-backend, test-frontend, e2e-smoke, collector, sonarqube, security, release-tooling, release]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && needs.e2e-smoke.result == 'success'
      && (needs.release.result == 'success' || (github.ref != 'refs/heads/main' && needs.release.result == 'skipped')) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The programs a machine installs are the ones the `collector` job built and tested on this very commit (ADR 0029): their checksum is
      # verified here, and they go in the image under the names the server serves (a Windows and a Linux one, both x86_64).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mnemarr-collector-ubuntu-latest
          path: collector-programs/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mnemarr-collector-windows-latest
          path: collector-programs/windows
      - name: Put the programs in the image
        run: |
          set -euo pipefail
          (cd collector-programs/linux && sha256sum -c mnemarr-collector.sha256)
          (cd collector-programs/windows && sha256sum -c mnemarr-collector.exe.sha256)
          mv collector-programs/linux/mnemarr-collector collector-programs/mnemarr-collector-linux-x86_64
          mv collector-programs/windows/mnemarr-collector.exe collector-programs/mnemarr-collector-windows-x86_64.exe
          rm -rf collector-programs/linux collector-programs/windows
          test -s collector-programs/mnemarr-collector-linux-x86_64
          test -s collector-programs/mnemarr-collector-windows-x86_64.exe
          ls -l collector-programs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # X.Y.Z.<run> for a release (the application shows it), 0.0.0-<ref>.<run> for any other build.
      - id: version
        env:
          RELEASE: ${{ needs.release.outputs.version }}
          RUN: ${{ github.run_number }}
          REF: ${{ github.ref_name }}
        run: echo "value=$(bash tools/release/scripts/version.sh)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          # The branch name (develop, main) plus the commit; the version and latest only when a release was made.
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.version != '' }}
      # The build stages run on the runner's own architecture and the final stage only copies files (Dockerfile), so the arm64
      # image needs no emulation. It is built here and not started: the end-to-end test runs the amd64 image (docs/releasing.md).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          # A release is built from nothing and reads no layer cache (a layer written by an earlier job of the push could carry a
          # poisoned layer into the image published under the version), and writes none. Other builds use the cache.
          no-cache: ${{ needs.release.outputs.version != '' }}
          cache-from: ${{ needs.release.outputs.version == '' && 'type=gha' || '' }}
          # Nor does a release write the cache that later builds read.
          cache-to: ${{ needs.release.outputs.version == '' && 'type=gha,mode=max' || '' }}
